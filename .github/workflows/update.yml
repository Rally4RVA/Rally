name: Update shows

on:
  schedule:
    - cron: "0 10 * * *"   # every morning, about 6am Richmond time
  workflow_dispatch:        # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install browser
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Scrape The Camel
        run: python scrape_camel.py

      - name: Save events.json
        run: |
          git config user.name "rally-bot"
          git config user.email "rally-bot@users.noreply.github.com"
          git add events.json
          git diff --cached --quiet || git commit -m "Update shows"
          git push
